<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="580" viewBox="0 0 1050 580" role="img" aria-labelledby="title desc"><title id="title">Subagent Profiles — native renderer illustration</title><desc id="desc">Production component render at 120 columns with synthetic bundled data and neutral palette, typeset as SVG. Not a terminal screenshot.</desc><rect width="100%" height="100%" rx="8" fill="#202020"/><text x="20" y="28" fill="#aaaaaa" font-family="Menlo, monospace" font-size="12">ILLUSTRATION · synthetic native-component output · not a screenshot</text><text x="20" y="62" xml:space="preserve" fill="#b4a2df" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│ Subagent Profiles · resolved · read-only                                                                             │</text><text x="20" y="84" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│ &gt; general                    │ general                                                                               │</text><text x="20" y="106" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│   scout                      │ Description                                                                           │</text><text x="20" y="128" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│   review                     │ General read-only delegation                                                          │</text><text x="20" y="150" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│   implementation             │ Prompt                                                                                │</text><text x="20" y="172" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ Complete the assigned analysis and report the evidence and limitations.               │</text><text x="20" y="194" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ Tools ceiling: read, grep, find, ls                                                   │</text><text x="20" y="216" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ Callable tools: unknown in command context; inspect admitted task tools.              │</text><text x="20" y="238" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ Skills (exact paths): none                                                            │</text><text x="20" y="260" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ Spawn ceiling: none                                                                   │</text><text x="20" y="282" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ Coordination: none                                                                    │</text><text x="20" y="304" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ Model default: selected parent model                                                  │</text><text x="20" y="326" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ Models grant: no explicit override grant                                              │</text><text x="20" y="348" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ Prewalk: off                                                                          │</text><text x="20" y="370" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ Admission also applies parent/ancestry, model availability, capacity and writer       │</text><text x="20" y="392" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │ checks. This viewer grants nothing.                                                   │</text><text x="20" y="414" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │                                                                                       │</text><text x="20" y="436" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │                                                                                       │</text><text x="20" y="458" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textLength="1008" lengthAdjust="spacingAndGlyphs">│                              │                                                                                       │</text><text x="20" y="480" xml:space="preserve" fill="#dddddd" font-family="Menlo, monospace" font-size="14" textL