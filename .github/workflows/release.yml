name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'howarewoo/pi-extended-subagents' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts
      - name: Check tag and extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check -- "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
      - run: npm run check
      - name: Pack release
        id: pack
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const [pkg] = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "pack.json"), "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "tarball=" + path.join(process.env.RUNNER_TEMP, pkg.filename) + "\n");
          '
      - name: Smoke-test the release tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run test:package -- "$TARBALL"
      - name: Publish through npm trusted publishing
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/publish-package.mjs "$TARBALL"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "GitHub release already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
